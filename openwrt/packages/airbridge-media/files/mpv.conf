# Administrator-reviewed configuration; trusted built-in fast profile, no executable hooks.
# Native KMS/DRM output; connector, mode and audio require real device checks.
vo=gpu
profile=fast
gpu-context=drm
gpu-api=opengl
# VC4 primary zpos is fixed at 0; the GUI overlay supports zpos >= 1.
# Put decoded DRM PRIME video on primary and the transparent GUI above it.
gpu-hwdec-interop=drmprime-overlay
drm-draw-plane=overlay
drm-drmprime-video-plane=primary
drm-format=xrgb8888
drm-mode=3840x2160@30
ao=alsa
fullscreen=yes
keep-open=no
volume=50
volume-max=100
demuxer-max-bytes=67108864
demuxer-max-back-bytes=8388608
sub-fonts-dir=/usr/share/airbridge-media/fonts
sub-font=DejaVu Sans
